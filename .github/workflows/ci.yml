name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator (firebase-tools >= 14.6) requires Java 21+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # TODO: remove continue-on-error once the existing lint errors are
      # fixed, so lint becomes a blocking check for new code.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
