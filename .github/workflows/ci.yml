name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator (firebase-tools >= 14.6) requires Java 21+
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      # The root tsconfig is solution-style ("files": []), so a plain
      # `tsc --noEmit` checks nothing — point at the app project explicitly.
      # TODO: remove continue-on-error once the ~90 pre-existing type errors
      # are fixed, so the type check becomes a blocking gate.
      - name: Type check (report only)
        run: npx tsc --noEmit -p tsconfig.app.json
        continue-on-error: true

      # TODO: remove continue-on-error once the existing lint errors are
      # fixed, so lint becomes a blocking check for new code.
      - name: Lint (report only)
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Functions unit tests
        run: npm ci --prefix functions && npm test --prefix functions

      - name: Firestore rules tests
        run: npm run test:rules

      # Audit only shipped (production) dependencies at the blocking gate —
      # dev tooling (firebase-tools, eslint and their transitive deps) never
      # reaches users and has no non-breaking fix. Report-only for now: the
      # sole remaining prod high is the react-router RSC-mode CSRF advisory,
      # which does not apply to this SPA and has no patched 7.x release yet.
      # TODO: make this blocking once react-router ships a fixed 7.x.
      - name: Security audit (production deps, report only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # Full audit (incl. dev deps) for visibility; never blocks.
      - name: Security audit (all deps, informational)
        run: npm audit || true

      - name: Build
        run: npm run build
